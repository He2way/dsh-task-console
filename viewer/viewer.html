<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 模型查看器</title>
<style>
  :root { --fg:#0f172a; --fg2:#475569; --line:rgba(148,163,184,.45); --panel:rgba(248,250,252,.94); --acc:#6366f1; }
  html,body { margin:0; height:100%; overflow:hidden; font:12px/1.5 system-ui,"Segoe UI",sans-serif; color:var(--fg); background:#eef2ff; }
  body[data-bg="dark"] { --fg:#e2e8f0; --fg2:#94a3b8; --panel:rgba(15,23,42,.92); background:#0b1120; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #bar { flex:none; display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:5px 8px; background:var(--panel); border-bottom:1px solid var(--line); }
  #name { font-weight:600; max-width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #info { color:var(--fg2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:60px; }
  button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:2px 8px; cursor:pointer; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button[data-on="1"] { border-color:var(--acc); color:var(--acc); background:rgba(99,102,241,.12); }
  #stage { position:relative; flex:1; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; text-align:center; color:var(--fg2); pointer-events:none; }
  #overlay[data-busy="1"] { color:var(--acc); }
  #overlay[data-error="1"] { color:#be123c; }
  #drop { position:absolute; inset:0; pointer-events:none; border:2px dashed transparent; }
  #drop[data-over="1"] { border-color:var(--acc); background:rgba(99,102,241,.08); }
</style>
</head>
<body data-bg="dark">
<div id="app">
  <div id="bar">
    <span id="name">3D 模型查看器</span>
    <span id="info">把 .glb/.gltf/.obj/.stl 文件拖进来，或点「打开文件…」</span>
    <button id="open" type="button">打开文件…</button>
    <button id="fit" type="button">重置视角</button>
    <button id="wire" type="button" title="显示三角网格边">线框</button>
    <button id="grid" type="button" data-on="1" title="显示地面网格">网格</button>
    <button id="bg" type="button" title="深色/浅色背景">背景</button>
  </div>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="drop"></div>
    <div id="overlay">等待模型…</div>
  </div>
</div>
<input id="file" type="file" accept=".glb,.gltf,.obj,.stl,model/gltf-binary,model/gltf+json" style="display:none">
